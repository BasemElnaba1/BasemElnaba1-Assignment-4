<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061827"/>
      <stop offset="1" stop-color="#0B2540"/>
    </linearGradient>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#58C8FF"/></marker>
    <marker id="arr2g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7FE0B2"/></marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.24"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg2)"/>
  <circle cx="1130" cy="50" r="200" fill="#7FE0B2" opacity="0.04"/>

  <text x="70" y="72" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" letter-spacing="3">C# INTERMEDIATE • 02/04</text>
  <text x="70" y="155" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700">Reference types &amp; ref</text>
  <text x="70" y="210" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="29">Modify the object — or replace the caller’s reference.</text>

  <rect x="70" y="270" width="1060" height="365" rx="32" fill="#102D48" filter="url(#shadow2)"/>
  <rect x="105" y="305" width="250" height="58" rx="17" fill="#58C8FF"/>
  <text x="230" y="344" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans Mono, monospace" font-size="25" font-weight="700">Change(int[])</text>
  <text x="105" y="407" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">The reference is copied. Both variables point to the same array.</text>

  <rect x="120" y="470" width="220" height="90" rx="18" fill="#092137" stroke="#58C8FF" stroke-width="3"/>
  <text x="230" y="505" text-anchor="middle" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="20">CALLER VARIABLE</text>
  <text x="230" y="540" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="25">numbers</text>
  <line x1="340" y1="515" x2="455" y2="515" stroke="#58C8FF" stroke-width="5" marker-end="url(#arr2)"/>

  <rect x="470" y="455" width="300" height="120" rx="20" fill="#173C5B"/>
  <text x="620" y="492" text-anchor="middle" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="20">ONE ARRAY OBJECT</text>
  <rect x="515" y="515" width="58" height="42" rx="8" fill="#58C8FF"/><rect x="591" y="515" width="58" height="42" rx="8" fill="#255372"/><rect x="667" y="515" width="58" height="42" rx="8" fill="#255372"/>
  <text x="544" y="544" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="700">99</text>
  <text x="620" y="544" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="22">2</text>
  <text x="696" y="544" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="22">3</text>

  <rect x="855" y="470" width="220" height="90" rx="18" fill="#092137" stroke="#58C8FF" stroke-width="3"/>
  <text x="965" y="505" text-anchor="middle" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="20">METHOD VARIABLE</text>
  <text x="965" y="540" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="25">values</text>
  <path d="M855 515 C815 515 815 585 760 565" fill="none" stroke="#58C8FF" stroke-width="5" marker-end="url(#arr2)"/>
  <text x="105" y="607" fill="#7FE0B2" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">✓ values[0] = 99 is visible to the caller</text>

  <rect x="70" y="680" width="510" height="390" rx="32" fill="#102D48" filter="url(#shadow2)"/>
  <text x="110" y="735" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700">Normal parameter</text>
  <text x="110" y="778" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="24">Reassigning changes only the local copy.</text>
  <rect x="110" y="830" width="160" height="72" rx="16" fill="#092137"/>
  <text x="190" y="875" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="23">caller</text>
  <line x1="270" y1="866" x2="390" y2="866" stroke="#58C8FF" stroke-width="5" marker-end="url(#arr2)"/>
  <rect x="405" y="830" width="125" height="72" rx="16" fill="#173C5B"/>
  <text x="468" y="875" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="22">old[]</text>
  <path d="M190 930 L190 970 L390 970" fill="none" stroke="#FFC766" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arr2)"/>
  <rect x="405" y="935" width="125" height="72" rx="16" fill="#5A4824"/>
  <text x="468" y="980" text-anchor="middle" fill="#FFF4D8" font-family="DejaVu Sans Mono, monospace" font-size="22">new[]</text>
  <text x="110" y="1033" fill="#FFC766" font-family="DejaVu Sans, sans-serif" font-size="22">Method variable moves; caller stays.</text>

  <rect x="620" y="680" width="510" height="390" rx="32" fill="#102D48" filter="url(#shadow2)"/>
  <text x="660" y="735" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700">ref parameter</text>
  <text x="660" y="778" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="24">Reassigning replaces the caller’s reference.</text>
  <rect x="660" y="830" width="160" height="72" rx="16" fill="#092137" stroke="#7FE0B2" stroke-width="3"/>
  <text x="740" y="875" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="23">caller</text>
  <path d="M820 866 C880 866 875 970 940 970" fill="none" stroke="#7FE0B2" stroke-width="5" marker-end="url(#arr2g)"/>
  <rect x="955" y="935" width="125" height="72" rx="16" fill="#225341"/>
  <text x="1018" y="980" text-anchor="middle" fill="#E2FFF1" font-family="DejaVu Sans Mono, monospace" font-size="22">new[]</text>
  <rect x="955" y="830" width="125" height="72" rx="16" fill="#173C5B" opacity="0.45"/>
  <text x="1018" y="875" text-anchor="middle" fill="#8FB7D4" font-family="DejaVu Sans Mono, monospace" font-size="22">old[]</text>
  <text x="660" y="1033" fill="#7FE0B2" font-family="DejaVu Sans, sans-serif" font-size="22">Caller now points to the new array.</text>

  <text x="70" y="1140" fill="#5F88A5" font-family="DejaVu Sans, sans-serif" font-size="20">ACADEMY SCHEDULE ANALYZER • BASEM ELNABA</text>
</svg>
