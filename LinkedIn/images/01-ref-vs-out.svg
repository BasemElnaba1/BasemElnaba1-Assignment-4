<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061827"/>
      <stop offset="1" stop-color="#0B2540"/>
    </linearGradient>
    <marker id="cyan-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#58C8FF"/>
    </marker>
    <marker id="gold-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#FFC766"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1095" cy="95" r="180" fill="#58C8FF" opacity="0.05"/>
  <circle cx="85" cy="1115" r="210" fill="#FFC766" opacity="0.04"/>

  <text x="70" y="72" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" letter-spacing="3">C# INTERMEDIATE • 01/04</text>
  <text x="70" y="165" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="70" font-weight="700">ref vs out</text>
  <text x="70" y="218" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="30">Both return changes — but their contracts are different.</text>

  <rect x="70" y="285" width="510" height="725" rx="32" fill="#102D48" filter="url(#shadow)"/>
  <rect x="620" y="285" width="510" height="725" rx="32" fill="#102D48" filter="url(#shadow)"/>

  <rect x="110" y="325" width="120" height="64" rx="18" fill="#58C8FF"/>
  <text x="170" y="369" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700">ref</text>
  <text x="110" y="433" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">Update an existing value</text>

  <circle cx="140" cy="520" r="30" fill="#58C8FF"/>
  <text x="140" y="530" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">1</text>
  <text x="195" y="508" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">BEFORE CALL</text>
  <text x="195" y="543" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27">Variable must have a value</text>
  <line x1="140" y1="555" x2="140" y2="610" stroke="#58C8FF" stroke-width="5" marker-end="url(#cyan-arrow)"/>

  <circle cx="140" cy="650" r="30" fill="#58C8FF"/>
  <text x="140" y="660" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">2</text>
  <text x="195" y="638" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">INSIDE METHOD</text>
  <text x="195" y="673" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27">May read and change it</text>
  <line x1="140" y1="685" x2="140" y2="740" stroke="#58C8FF" stroke-width="5" marker-end="url(#cyan-arrow)"/>

  <circle cx="140" cy="780" r="30" fill="#58C8FF"/>
  <text x="140" y="790" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">3</text>
  <text x="195" y="768" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">ASSIGNMENT</text>
  <text x="195" y="803" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27">New value is optional</text>

  <rect x="110" y="865" width="430" height="100" rx="20" fill="#092137"/>
  <text x="135" y="908" fill="#58C8FF" font-family="DejaVu Sans Mono, monospace" font-size="24">AddTime(ref minutes);</text>
  <text x="135" y="944" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="22">Best for modifying existing state</text>

  <rect x="660" y="325" width="120" height="64" rx="18" fill="#FFC766"/>
  <text x="720" y="369" text-anchor="middle" fill="#402900" font-family="DejaVu Sans, sans-serif" font-size="38" font-weight="700">out</text>
  <text x="660" y="433" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">Produce a new result</text>

  <circle cx="690" cy="520" r="30" fill="#FFC766"/>
  <text x="690" y="530" text-anchor="middle" fill="#402900" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">1</text>
  <text x="745" y="508" fill="#C8AD79" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">BEFORE CALL</text>
  <text x="745" y="543" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27">No initial value required</text>
  <line x1="690" y1="555" x2="690" y2="610" stroke="#FFC766" stroke-width="5" marker-end="url(#gold-arrow)"/>

  <circle cx="690" cy="650" r="30" fill="#FFC766"/>
  <text x="690" y="660" text-anchor="middle" fill="#402900" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">2</text>
  <text x="745" y="638" fill="#C8AD79" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">INSIDE METHOD</text>
  <text x="745" y="673" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27">Must assign before return</text>
  <line x1="690" y1="685" x2="690" y2="740" stroke="#FFC766" stroke-width="5" marker-end="url(#gold-arrow)"/>

  <circle cx="690" cy="780" r="30" fill="#FFC766"/>
  <text x="690" y="790" text-anchor="middle" fill="#402900" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">3</text>
  <text x="745" y="768" fill="#C8AD79" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">RETURN</text>
  <text x="745" y="803" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="27">Caller receives the result</text>

  <rect x="660" y="865" width="430" height="100" rx="20" fill="#092137"/>
  <text x="685" y="908" fill="#FFC766" font-family="DejaVu Sans Mono, monospace" font-size="21">TryFind(name, out index);</text>
  <text x="685" y="944" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="22">Best for Try... methods &amp; outputs</text>

  <rect x="70" y="1055" width="1060" height="2" fill="#244A67"/>
  <text x="70" y="1110" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">Quick rule:</text>
  <text x="250" y="1110" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="26">ref updates what exists • out creates what must be returned</text>
  <text x="70" y="1160" fill="#5F88A5" font-family="DejaVu Sans, sans-serif" font-size="20">ACADEMY SCHEDULE ANALYZER • BASEM ELNABA</text>
</svg>
