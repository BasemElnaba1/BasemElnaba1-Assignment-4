<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061827"/><stop offset="1" stop-color="#0B2540"/></linearGradient>
    <marker id="arr3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#58C8FF"/></marker>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.24"/></filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg3)"/>
  <circle cx="1080" cy="120" r="190" fill="#58C8FF" opacity="0.05"/>
  <text x="70" y="72" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" letter-spacing="3">C# INTERMEDIATE • 03/04</text>
  <text x="70" y="160" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="700">params: flexible method calls</text>
  <text x="70" y="215" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="29">The arguments arrive inside the method as a normal array.</text>

  <rect x="70" y="270" width="1060" height="185" rx="30" fill="#102D48" filter="url(#shadow3)"/>
  <text x="110" y="320" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700">METHOD SIGNATURE</text>
  <text x="110" y="375" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="31">CalculateTotalDuration(</text>
  <rect x="615" y="335" width="168" height="57" rx="14" fill="#58C8FF"/>
  <text x="699" y="373" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans Mono, monospace" font-size="28" font-weight="700">params</text>
  <text x="800" y="375" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="31">int[] durations)</text>
  <text x="110" y="425" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="23">Rule: only one params parameter, and it must be last.</text>

  <text x="70" y="530" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">CALL</text>
  <rect x="70" y="565" width="150" height="80" rx="20" fill="#173C5B"/>
  <rect x="240" y="565" width="150" height="80" rx="20" fill="#173C5B"/>
  <rect x="410" y="565" width="150" height="80" rx="20" fill="#173C5B"/>
  <text x="145" y="617" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="30">120</text>
  <text x="315" y="617" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="30">180</text>
  <text x="485" y="617" text-anchor="middle" fill="#F7FBFF" font-family="DejaVu Sans Mono, monospace" font-size="30">240</text>

  <line x1="585" y1="605" x2="685" y2="605" stroke="#58C8FF" stroke-width="6" marker-end="url(#arr3)"/>
  <text x="640" y="580" text-anchor="middle" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="20">compiler packs</text>

  <rect x="700" y="535" width="430" height="140" rx="26" fill="#102D48" stroke="#58C8FF" stroke-width="3"/>
  <text x="915" y="575" text-anchor="middle" fill="#8FB7D4" font-family="DejaVu Sans, sans-serif" font-size="21">INSIDE THE METHOD</text>
  <text x="915" y="625" text-anchor="middle" fill="#58C8FF" font-family="DejaVu Sans Mono, monospace" font-size="30">int[] durations</text>
  <text x="915" y="658" text-anchor="middle" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="21">{ 120, 180, 240 }</text>

  <line x1="915" y1="690" x2="915" y2="765" stroke="#58C8FF" stroke-width="6" marker-end="url(#arr3)"/>
  <circle cx="915" cy="850" r="105" fill="#58C8FF"/>
  <text x="915" y="835" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">TOTAL</text>
  <text x="915" y="890" text-anchor="middle" fill="#05223A" font-family="DejaVu Sans Mono, monospace" font-size="45" font-weight="700">540</text>

  <rect x="70" y="735" width="700" height="285" rx="30" fill="#102D48" filter="url(#shadow3)"/>
  <text x="110" y="790" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">The same method handles every call</text>
  <text x="110" y="850" fill="#58C8FF" font-family="DejaVu Sans Mono, monospace" font-size="19">CalculateTotalDuration(120, 180)</text>
  <text x="730" y="850" text-anchor="end" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="20">2 values</text>
  <text x="110" y="910" fill="#58C8FF" font-family="DejaVu Sans Mono, monospace" font-size="19">CalculateTotalDuration(120, 180, 240)</text>
  <text x="730" y="910" text-anchor="end" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="20">3 values</text>
  <text x="110" y="970" fill="#58C8FF" font-family="DejaVu Sans Mono, monospace" font-size="19">CalculateTotalDuration(values)</text>
  <text x="730" y="970" text-anchor="end" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="20">existing array</text>

  <rect x="70" y="1060" width="1060" height="2" fill="#244A67"/>
  <text x="70" y="1110" fill="#F7FBFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Why use it?</text>
  <text x="250" y="1110" fill="#AFC7D9" font-family="DejaVu Sans, sans-serif" font-size="25">Flexible calls without writing multiple overloads.</text>
  <text x="70" y="1160" fill="#5F88A5" font-family="DejaVu Sans, sans-serif" font-size="20">ACADEMY SCHEDULE ANALYZER • BASEM ELNABA</text>
</svg>
